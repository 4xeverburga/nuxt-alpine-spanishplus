name: test

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Rebuild better-sqlite3 native binary
        run: pnpm rebuild better-sqlite3

      - name: Rebuild sharp native binary
        run: pnpm rebuild sharp

      - name: Run tests
        run: pnpm test
